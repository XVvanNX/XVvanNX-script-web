<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login XVvanNX</title>
<style>
body{background:#F0F0F0;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial}
.box{background:white;padding:20px;border:3px solid black;border-radius:12px;width:300px;text-align:center}
input{width:100%;padding:10px;margin:10px 0;border:2px solid black;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:10px;background:#1D9BF0;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <h2>XVvanNX</h2>
  <input type="text" id="nama" placeholder="Masukkan Nama">
  <button onclick="login()">Masuk</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCrTTBk1gPDVG4eVL_XfrdfFqelGPExSqU",
  authDomain: "van-social.firebaseapp.com",
  databaseURL: "https://van-social-default-rtdb.firebaseio.com",
  projectId: "van-social",
  storageBucket: "van-social.firebasestorage.app",
  messagingSenderId: "975410134186",
  appId: "1:975410134186:web:befaac94622eed85de64d3",
  measurementId: "G-ZVZXSKC42Q"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function login(){
  let nama = document.getElementById('nama').value.trim();
  if(nama == "") return alert("Isi nama dulu");

  localStorage.setItem('xv_nama', nama);

  db.ref('users/'+nama).once('value').then(s=>{
    if(!s.exists()){
      db.ref('users/'+nama).set({ nama: nama, foto: "", banner: "" });
    }
  })
  window.location.href = "index.html";
}
</script>
</body>
</html>
