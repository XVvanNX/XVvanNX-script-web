<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Teman</title>
<style>
body{background:#F0F0F0;padding:0;margin:0;font-family:Arial}
.header{display:flex;align-items:center;gap:10px;padding:10px;background:white;font-weight:bold;font-size:18px;border-bottom:3px solid black}
.header div:first-child{cursor:pointer}
.banner{width:100%;height:150px;background:#ccc;background-size:cover;background-position:center;border-bottom:3px solid black}
.profil-box{display:flex;flex-direction:column;align-items:center;background:white;padding:20px;margin-top:-50px;border:3px solid black;border-radius:12px;position:relative;z-index:2;margin: -50px 10px 0 10px}
.avatar{width:120px;height:120px;border:4px solid white;border-radius:50%;background:#ddd;background-size:cover;background-position:center;margin-bottom:15px;box-shadow:0 0 0 3px black}
.nama{font-size:24px;font-weight:bold}
.btn-hapus{margin-top:20px;padding:10px 20px;background:red;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div onclick="window.location.href='index.html'">←</div><div>Profil</div></div>
<div class="banner" id="bannerTeman"></div>
<div class="profil-box">
  <div class="avatar" id="avatarTeman"></div>
  <div class="nama" id="namaTeman">Memuat...</div>
  <button class="btn-hapus" onclick="hapusTeman()">Hapus Teman</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = { apiKey: "AIzaSyCrTTBk1gPDVG4eVL_XfrdfFqelGPExSqU", authDomain: "van-social.firebaseapp.com", databaseURL: "https://van-social-default-rtdb.firebaseio.com", projectId: "van-social", storageBucket: "van-social.firebasestorage.app", messagingSenderId: "975410134186", appId: "1:975410134186:web:befaac94622eed85de64d3", measurementId: "G-ZVZXSKC42Q" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = localStorage.getItem('xv_nama');
let idTeman = localStorage.getItem('profil_teman_id');

db.ref('users/'+idTeman).once('value').then(s=>{
  let data = s.val();
  document.getElementById('namaTeman').innerText = data.nama;
  document.getElementById('avatarTeman').style.backgroundImage = `url(${data.foto})`;
  document.getElementById('bannerTeman').style.backgroundImage = `url(${data.banner})`;
})

function hapusTeman(){
  if(confirm("Yakin mau hapus "+idTeman+" dari teman?")){
    db.ref('teman/'+currentUser+'/'+idTeman).remove().then(()=>{
      alert("Teman dihapus");
      window.location.href = "index.html";
    })
  }
}
</script>
</body>
</html>
