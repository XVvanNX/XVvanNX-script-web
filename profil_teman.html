<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Teman</title>
<style>
    * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F0F0F0; }
.banner { height: 150px; background: #ccc; border-bottom: 4px solid black; background-size: cover; background-position: center; }
.profil-info { background: white; padding: 15px; border-bottom: 4px solid black; position: relative; }
.profil-atas { display: flex; align-items: center; gap: 15px; }
    #avatarProfil { width: 90px; height: 90px; border: 4px solid black; border-radius: 50%; position: relative; margin-top: -45px; background: #ddd; background-size: cover; background-position: center; z-index: 3; }
    #namaProfil { font-size: 28px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
.centang-biru {
    width: 22px;
    height: 22px;
    background: #1D9BF0;
    border-radius: 50%;
    display: none;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 14px;
    font-weight: bold;
    border: 2px solid white;
  }
.stats { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
.stat-box { background: white; border: 3px solid black; border-radius: 10px; padding: 5px 12px; font-weight: bold; }
.back { padding: 10px; background: white; border-bottom: 2px solid black; cursor: pointer; font-weight: bold; }
.btn-hapus { width: 100%; margin-top: 15px; padding: 10px; background: red; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
    <div class="back" onclick="window.location.href='index.html'">← Kembali</div>

    <div class="banner" id="bannerProfil"></div>

    <div class="profil-info">
      <div class="profil-atas">
        <div id="avatarProfil"></div>
        <div>
          <div id="namaProfil">
            <span id="textNama">Loading...</span>
            <div class="centang-biru" id="badgeVerif">✓</div>
          </div>
        </div>
      </div>
      <div class="stats"><div class="stat-box"><span id="jmlTeman">0</span> Friend</div><div class="stat-box">0 Followers</div><div class="stat-box">0 Following</div></div>
      <button class="btn-hapus" onclick="hapusTeman()">Hapus Teman</button>
    </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = { apiKey: "AIzaSyCrTTBk1gPDVG4eVL_XfrdfFqelGPExSqU", authDomain: "van-social.firebaseapp.com", databaseURL: "https://van-social-default-rtdb.firebaseio.com", projectId: "van-social", storageBucket: "van-social.firebasestorage.app", messagingSenderId: "975410134186", appId: "1:975410134186:web:befaac94622eed85de64d3", measurementId: "G-ZVZXSKC42Q" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let namaSaya = localStorage.getItem('xv_nama');
let namaTeman = localStorage.getItem('profil_teman_id');

db.ref('users/'+namaTeman).once('value').then(s=>{
  let data = s.val();
  document.getElementById('textNama').innerText = namaTeman;
  document.getElementById('avatarProfil').style.backgroundImage = `url(${data.foto || ''})`; // BISA DILIHAT ORANG
  document.getElementById('bannerProfil').style.backgroundImage = `url(${data.banner || ''})`; // BISA DILIHAT ORANG

  if(namaTeman === "Van"){ // CENTANG BIRU JUGA BISA DILIHAT ORANG
    document.getElementById('badgeVerif').style.display = 'flex';
  }
})
db.ref('teman/'+namaTeman).once('value').then(s=>{
  document.getElementById('jmlTeman').innerText = s.numChildren();
})

function hapusTeman(){
  if(confirm("Yakin hapus "+namaTeman+"?")){
    db.ref('teman/'+namaSaya+'/'+namaTeman).remove().then(()=>{
      window.location.href = "index.html";
    })
  }
}
</script>
</body>
</html>
