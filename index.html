<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beranda XVvanNX</title>
<style>
* { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
body { background: #F0F0F0; }

/* TOMBOL MENU */
.menu { font-size: 24px; font-weight: bold; cursor: pointer; padding: 5px 10px; border: 2px solid black; border-radius: 8px; background: white; }

/* HEADER */
.header { display: flex; align-items: center; gap: 10px; padding: 10px; background: white; border-radius: 12px; border: 3px solid black; margin: 10px; }
.logo { font-size: 20px; font-weight: bold; }
.logo.v { border: 2px solid black; border-radius: 50%; padding: 0 4px; }

/* SIDEBAR */
.sidebar {
  height: 100%; width: 0; position: fixed; top: 0; left: 0;
  background-color: white; overflow-x: hidden; transition: 0.3s;
  padding-top: 20px; border-right: 4px solid black; z-index: 999;
}
.back-btn { 
  font-size: 18px; padding: 12px 20px; border-bottom: 3px solid black; 
  cursor: pointer; font-weight: bold; margin-bottom: 10px;
}
.sidebar a {
  padding: 15px 20px; text-decoration: none; font-size: 20px;
  color: black; display: flex; align-items: center; gap: 10px;
  border-bottom: 2px solid #ddd; font-weight: bold;
}
.sidebar a:hover { background-color: #eee; }

/* KONTEN */
.content { padding: 10px; transition: 0.3s; }

.profil-box { display: flex; align-items: center; gap: 15px; margin-top: 15px; background: white; padding: 15px; border-radius: 12px; border: 3px solid black; cursor: pointer; }
.avatar { width: 60px; height: 60px; border: 3px solid black; border-radius: 50%; background: #ddd; background-size: cover; background-position: center; }
.nama { font-size: 22px; font-weight: bold; }
.teman-title { margin-top: 20px; font-size: 18px; font-weight: bold; }
.teman-list { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; padding-bottom:5px }
.teman { width: 70px; height: 70px; border: 3px solid black; border-radius: 50%; background: white; display: flex; justify-content: center; align-items: center; flex-shrink: 0; cursor: pointer; background-size: cover; background-position:center; position:relative }
.add { font-size: 30px; background: white; }
.del { position:absolute;background:red;color:white;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;text-align:center;top:-5px;right:-5px;cursor:pointer }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="mySidebar" class="sidebar">
  <div class="back-btn" onclick="tutupSidebar()">← Kembali</div>
  <a href="bypass.html">🔑 Bypass ng</a>
  <a href="musik.html">🎵 Musik</a>
</div>

<!-- KONTEN UTAMA -->
<div id="mainContent" class="content">
    <div class="header">
      <div class="menu" onclick="bukaSidebar()">☰</div>
      <div class="logo">X<span class="v">V</span>vanNX</div>
    </div>

    <div class="profil-box" onclick="window.location.href='profil.html'">
      <div class="avatar" id="avatarBeranda"></div>
      <div class="nama" id="namaBeranda">NAMA</div>
    </div>

    <div class="teman-title">Teman</div>
    <div class="teman-list" id="temanList">
        <div class="teman add" onclick="window.location.href='teman.html'">+</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCrTTBk1gPDVG4eVL_XfrdfFqelGPExSqU",
  authDomain: "van-social.firebaseapp.com",
  databaseURL: "https://van-social-default-rtdb.firebaseio.com",
  projectId: "van-social",
  storageBucket: "van-social.firebasestorage.app",
  messagingSenderId: "975410134186",
  appId: "1:975410134186:web:befaac94622eed85de64d3",
  measurementId: "G-ZVZXSKC42Q"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = localStorage.getItem('xv_nama');
if(!currentUser){ window.location.href = "login.html"; }

// FUNGSI SIDEBAR
function bukaSidebar() {
  document.getElementById("mySidebar").style.width = "260px";
}
function tutupSidebar() {
  document.getElementById("mySidebar").style.width = "0";
}

window.onload = function() {
    document.getElementById('namaBeranda').innerText = localStorage.getItem('xv_nama');
    document.getElementById('avatarBeranda').style.backgroundImage = `url(${localStorage.getItem('xv_foto')})`;

    db.ref('teman/'+currentUser).on('value', snapshot=>{
        let list = document.getElementById('temanList');
        list.innerHTML = `<div class="teman add" onclick="window.location.href='teman.html'">+</div>`;
        snapshot.forEach(child=>{
            let id = child.key;
            let t = child.val();
            list.innerHTML += `
            <div class="teman" style="background-image:url(${t.foto})" onclick="bukaProfil('${id}')">
                <div class="del" onclick="event.stopPropagation(); hapusTeman('${id}')">x</div>
            </div>`;
        })
    })
}

function bukaProfil(id){
    localStorage.setItem('profil_teman_id', id);
    window.location.href = 'profil_teman.html';
}

function hapusTeman(id){
  if(confirm("Hapus "+id+" dari teman?")){
    db.ref('teman/'+currentUser+'/'+id).remove();
  }
}
</script>
</body>
</html>
