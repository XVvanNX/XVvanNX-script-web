<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XVvanNX</title>
<style>
    * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F0F0F0; }
    .page { display: none; }
    .page.active { display: block; }

    /* ===== LOGIN ===== */
    #login { display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; gap: 15px; text-align: center; }
    #login h1 { font-size: 32px; }
    #login h1 .v { border: 3px solid black; border-radius: 50%; padding: 0 6px; }
    #login input { width: 80%; max-width: 300px; padding: 12px; border: 3px solid black; border-radius: 10px; font-size: 16px; }
    #login button { padding: 12px 25px; background: #00B000; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }

    /* ===== BERANDA ===== */
    #beranda { padding: 10px; }
    .header { display: flex; align-items: center; gap: 10px; padding: 10px; background: white; border-radius: 12px; border: 3px solid black; }
    .menu { font-size: 24px; font-weight: bold; }
    .logo { font-size: 20px; font-weight: bold; }
    .logo .v { border: 2px solid black; border-radius: 50%; padding: 0 4px; }
    .profil-box { display: flex; align-items: center; gap: 15px; margin-top: 15px; background: white; padding: 15px; border-radius: 12px; border: 3px solid black; cursor: pointer; }
    .profil-box:active { background: #eee; }
    .avatar { width: 60px; height: 60px; border: 3px solid black; border-radius: 50%; background: #ddd; background-size: cover; background-position: center; }
    .nama { font-size: 22px; font-weight: bold; }
    .teman-title { margin-top: 20px; font-size: 18px; font-weight: bold; }
    .teman-list { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; }
    .teman { width: 70px; height: 70px; border: 3px solid black; border-radius: 50%; background: white; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
    .add { font-size: 30px; }

    /* ===== PROFIL ===== */
    .banner { height: 150px; background: #ccc; position: relative; border-bottom: 4px solid black; background-size: cover; background-position: center; }
    .ganti-banner { position: absolute; bottom: 10px; right: 10px; background: white; border: 2px solid black; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; z-index: 2; }
    .profil-info { background: white; padding: 15px; border-bottom: 4px solid black; position: relative; }
    .profil-atas { display: flex; align-items: center; gap: 15px; }
    #avatarProfil { width: 90px; height: 90px; border: 4px solid black; position: relative; margin-top: -45px; background: #ddd; z-index: 3; }
    .edit-foto { position: absolute; bottom: 0; right: 0; background: white; border: 2px solid black; border-radius: 50%; width: 28px; height: 28px; font-size: 14px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    #namaProfil { font-size: 28px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
    .edit-nama { font-size: 16px; cursor: pointer; }
    .stats { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .stat-box { background: white; border: 3px solid black; border-radius: 10px; padding: 5px 12px; font-weight: bold; }
    .achievement-title { padding: 15px; font-size: 20px; font-weight: bold; }
    .achievement-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 15px 20px; }
    .ach-box { background: white; border: 3px solid black; border-radius: 12px; height: 80px; }
    .back { padding: 10px; background: white; border-bottom: 2px solid black; cursor: pointer; font-weight: bold; }

    /* ===== POPUP EDIT ===== */
    .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; }
    .popup-box { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 300px; border: 3px solid black; }
    .popup-box h2 { margin-bottom: 15px; }
    .popup-box input { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid black; border-radius: 8px; font-size: 16px; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #00B000; color: white; margin-bottom: 10px; }
    .btn-close { background: #E2231A; color: white; }
</style>
</head>
<body>

  <!-- HALAMAN 0: LOGIN NAMA -->
  <div id="login" class="page">
    <h1>X<span class="v">V</span>vanNX</h1>
    <p>Selamat Datang! Masukkan Nama Kamu</p>
    <input type="text" id="inputLoginNama" placeholder="Contoh: XVvanNX">
    <button onclick="loginSederhana()">Masuk</button>
  </div>

  <!-- HALAMAN 1: BERANDA -->
  <div id="beranda" class="page">
    <div class="header">
      <div class="menu">☰</div>
      <div class="logo">X<span class="v">V</span>vanNX</div>
    </div>
    <div class="profil-box" id="btnKeProfil">
      <div class="avatar" id="avatarBeranda"></div>
      <div class="nama" id="namaBeranda">NAMA</div>
    </div>
    <div class="teman-title">Teman</div>
    <div class="teman-list"><div class="teman add">+</div><div class="teman"></div><div class="teman"></div></div>
  </div>

  <!-- HALAMAN 2: PROFIL -->
  <div id="profil" class="page">
    <div class="back" id="btnKembali">← Kembali</div>
    <div class="banner" id="bannerProfil"><input type="file" id="inputBanner" accept="image/*" style="display:none"><div class="ganti-banner" id="btnBanner">📷</div></div>
    <div class="profil-info">
      <div class="profil-atas">
        <div class="avatar" id="avatarProfil"><input type="file" id="inputFoto" accept="image/*" style="display:none"><div class="edit-foto" id="btnFoto">✏️</div></div>
        <div><div id="namaProfil"><span id="textNama">Nama</span><span class="edit-nama" id="btnEditNama">✏️</span></div></div>
      </div>
      <div class="stats"><div class="stat-box">0 Friend</div><div class="stat-box">0 Followers</div><div class="stat-box">0 Following</div></div>
    </div>
    <div class="achievement-title">Achievement</div>
    <div class="achievement-grid"><div class="ach-box"></div><div class="ach-box"></div><div class="ach-box"></div><div class="ach-box"></div><div class="ach-box"></div></div>
  </div>

  <!-- POPUP EDIT NAMA -->
  <div class="popup" id="popupEdit"><div class="popup-box"><h2>Edit Nama</h2><input type="text" id="inputNama"><button class="btn btn-save" id="btnSimpan">Simpan</button><button class="btn btn-close" id="btnTutup">Tutup</button></div></div>

<script>
  // CEK APA UDAH PERNAH LOGIN
  window.onload = function() {
    let nama = localStorage.getItem('xv_nama');
    if(nama && nama !== ""){ 
      bukaHalaman('beranda'); // kalau udah ada nama, langsung ke beranda
      loadData();
    } else { 
      bukaHalaman('login'); // kalau belum ada, suruh login dulu
    }
    
    // Event semua tombol
    document.getElementById('btnKeProfil').onclick = () => bukaHalaman('profil');
    document.getElementById('btnKembali').onclick = () => bukaHalaman('beranda');
    document.getElementById('btnEditNama').onclick = bukaPopup;
    document.getElementById('btnTutup').onclick = tutupPopup;
    document.getElementById('btnSimpan').onclick = simpanNama;
    document.getElementById('btnFoto').onclick = () => document.getElementById('inputFoto').click();
    document.getElementById('btnBanner').onclick = () => document.getElementById('inputBanner').click();
    document.getElementById('inputFoto').onchange = gantiFoto;
    document.getElementById('inputBanner').onchange = gantiBanner;
  }

  // FUNGSI LOGIN PERTAMA KALI
  function loginSederhana(){
    let nama = document.getElementById('inputLoginNama').value;
    if(nama.trim() !== ""){
      localStorage.setItem('xv_nama', nama); // SIMPAN NAMA
      bukaHalaman('beranda');
      loadData();
    } else {
      alert("Nama jangan kosong ya!");
    }
  }

  function bukaHalaman(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function loadData(){
    let nama = localStorage.getItem('xv_nama') || 'Nama';
    let foto = localStorage.getItem('xv_foto') || '';
    let banner = localStorage.getItem('xv_banner') || '';
    document.getElementById('textNama').innerText = nama;
    document.getElementById('namaBeranda').innerText = nama;
    if(foto) {
      document.getElementById('avatarProfil').style.backgroundImage = `url(${foto})`;
      document.getElementById('avatarBeranda').style.backgroundImage = `url(${foto})`;
    }
    if(banner) document.getElementById('bannerProfil').style.backgroundImage = `url(${banner})`;
  }

  // FUNGSI EDIT
  function bukaPopup() {document.getElementById('popupEdit').style.display = 'flex'; document.getElementById('inputNama').value = document.getElementById('textNama').innerText;}
  function tutupPopup() {document.getElementById('popupEdit').style.display = 'none';}
  function simpanNama() {let namaBaru = document.getElementById('inputNama').value; if(namaBaru.trim() !== ""){localStorage.setItem('xv_nama', namaBaru); document.getElementById('textNama').innerText = namaBaru; document.getElementById('namaBeranda').innerText = namaBaru;} tutupPopup();}
  function gantiFoto(event) {let file = event.target.files[0]; if(!file) return; let reader = new FileReader(); reader.onload = function(e){let data = e.target.result; localStorage.setItem('xv_foto', data); document.getElementById('avatarProfil').style.backgroundImage = `url(${data})`; document.getElementById('avatarBeranda').style.backgroundImage = `url(${data})`;} reader.readAsDataURL(file);}
  function gantiBanner(event) {let file = event.target.files[0]; if(!file) return; let reader = new FileReader(); reader.onload = function(e){let data = e.target.result; localStorage.setItem('xv_banner', data); document.getElementById('bannerProfil').style.backgroundImage = `url(${data})`;} reader.readAsDataURL(file);}
</script>
</body>
</html>
