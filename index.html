<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XVvanNX</title>
<style>
    * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F0F0F0; }

    .header {
        padding: 10px 15px;
        background: white;
        border-bottom: 3px solid black;
    }
    .header-box {
        border: 3px solid black;
        border-radius: 10px;
        padding: 10px;
        font-weight: bold;
        font-size: 18px;
    }

    .profil-box {
        margin: 15px;
        background: white;
        border: 3px solid black;
        border-radius: 12px;
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer; /* biar ada tangan pas diarahin */
    }
    .avatar {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        border: 2px solid black;
        object-fit: cover;
    }
    .nama-profil {
        font-weight: bold;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .centang {
        width: 18px;
        height: 18px;
        background: #1D9BF0;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 12px;
    }

    .teman-section {
        padding: 0 15px;
    }
    .judul-teman {
        font-weight: bold;
        margin-bottom: 10px;
    }
    .list-teman {
        display: flex;
        gap: 15px;
    }
    .btn-bulat {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 3px solid black;
        background: white;
        font-size: 30px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>
<body>

    <div class="header">
        <div class="header-box">☰ XVvanNX</div>
    </div>

    <!-- PROFIL KLIK MASUK KE profil.html LAGI -->
    <div class="profil-box" onclick="window.location.href='profil.html'">
        <img src="https://i.imgur.com/8Km9tLL.png" class="avatar">
        <div class="nama-profil">
            <div class="centang">V</div>
            <span id="namaUser">Van</span>
        </div>
    </div>

    <div class="teman-section">
        <div class="judul-teman">Teman</div>
        <div class="list-teman">
            <!-- TOMBOL + UDAH KE teman.html -->
            <button class="btn-bulat" onclick="window.location.href='teman.html'">+</button>
            <button class="btn-bulat"></button>
            <button class="btn-bulat"></button>
        </div>
    </div>

<script>
    let nama = localStorage.getItem('xv_nama');
    if(nama){
        document.getElementById('namaUser').innerText = nama;
    }
</script>

</body>
</html>
