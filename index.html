<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XVvanNX</title>
<style>
    * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F0F0F0; }
 .page { display: none; } /* semua halaman disembunyiin dulu */
 .page.active { display: block; } /* yg aktif ditampilin */

  /* ===== BERANDA ===== */
  #beranda { padding: 10px; }
.header { display: flex; align-items: center; gap: 10px; padding: 10px; background: white; border-radius: 12px; border: 3px solid black; }
.menu { font-size: 24px; font-weight: bold; }
.logo { font-size: 20px; font-weight: bold; }
.logo.v { border: 2px solid black; border-radius: 50%; padding: 0 4px; }
.profil { display: flex; align-items: center; gap: 15px; margin-top: 15px; background: white; padding: 15px; border-radius: 12px; border: 3px solid black; cursor: pointer; }
.avatar { width: 60px; height: 60px; border: 3px solid black; border-radius: 50%; background: #ddd; background-size: cover; }
.nama { font-size: 22px; font-weight: bold; }
.teman-title { margin-top: 20px; font-size: 18px; font-weight: bold; }
.teman-list { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; }
.teman { width: 70px; height: 70px; border: 3px solid black; border-radius: 50%; background: white; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
.add { font-size: 30px; }

  /* ===== PROFIL ===== */
 #profil.banner { height: 150px; background: #ccc; position: relative; border-bottom: 4px solid black; }
.ganti-banner { position: absolute; bottom: 10px; right: 10px; background: white; border: 2px solid black; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; }
.profil-info { background: white; padding: 15px; border-bottom: 4px solid black; }
.profil-atas { display: flex; align-items: center; gap: 15px; }
 #profil.avatar { width: 90px; height: 90px; border: 4px solid black; position: relative; }
.edit-foto { position: absolute; bottom: 0; right: 0; background: white; border: 2px solid black; border-radius: 50%; width: 25px; height: 25px; font-size: 14px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
 #profil.nama { font-size: 28px; font-weight: bold; }
.edit-nama { font-size: 12px; cursor: pointer; margin-left: 5px; }
.stats { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
.stat-box { background: white; border: 3px solid black; border-radius: 10px; padding: 5px 12px; font-weight: bold; }
.achievement-title { padding: 15px; font-size: 20px; font-weight: bold; }
.achievement-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 15px 20px; }
.ach-box { background: white; border: 3px solid black; border-radius: 12px; height: 80px; }
.back { padding: 10px; background: white; border-bottom: 2px solid black; cursor: pointer; font-weight: bold; }

  /* ===== POPUP EDIT ===== */
.popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; }
.popup-box { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 300px; border: 3px solid black; }
.popup-box h2 { margin-bottom: 15px; }
.popup-box input { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid black; border-radius: 8px; font-size: 16px; }
.btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
.btn-save { background: #00B000; color: white; margin-bottom: 10px; }
.btn-close { background: #E2231A; color: white; }
</style>
</head>
<body>

  <!-- HALAMAN 1: BERANDA -->
  <div id="beranda" class="page active">
    <div class="header">
      <div class="menu">☰</div>
      <div class="logo">X<span class="v">V</span>vanNX</div>
    </div>

    <div class="profil" onclick="bukaHalaman('profil')">
      <div class="avatar" id="avatarBeranda"></div>
      <div class="nama" id="namaBeranda">NAMA</div>
    </div>

    <div class="teman-title">Teman</div>
    <div class="teman-list">
      <div class="teman add">+</div>
      <div class="teman"></div>
      <div class="teman"></div>
    </div>
  </div>

  <!-- HALAMAN 2: PROFIL -->
  <div id="profil" class="page">
    <div class="back" onclick="bukaHalaman('beranda')">← Kembali</div>

    <div class="banner">
      <input type="file" id="inputBanner" accept="image/*" style="display:none" onchange="gantiBanner(event)">
      <div class="ganti-banner" onclick="document.getElementById('inputBanner').click()">📷</div>
    </div>

    <div class="profil-info">
      <div class="profil-atas">
        <div class="avatar" id="avatarProfil">
          <input type="file" id="inputFoto" accept="image/*" style="display:none" onchange="gantiFoto(event)">
          <div class="edit-foto" onclick="document.getElementById('inputFoto').click()">✏️</div>
        </div>
        <div>
          <div style="display:flex; align-items:center;">
            <div class="nama" id="namaProfil">Nama</div>
            <div class="edit-nama" onclick="bukaPopup()">✏️</div>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat-box">0 Friend</div>
        <div class="stat-box">0 Followers</div>
        <div class="stat-box">0 Following</div>
      </div>
    </div>

    <div class="achievement-title">Achievement</div>
    <div class="achievement-grid">
      <div class="ach-box"></div><div class="ach-box"></div><div class="ach-box"></div>
      <div class="ach-box"></div><div class="ach-box"></div>
    </div>
  </div>

  <!-- POPUP EDIT NAMA -->
  <div class="popup" id="popupEdit">
    <div class="popup-box">
      <h2>Edit Nama</h2>
      <input type="text" id="inputNama" placeholder="Masukkan Nama Baru">
      <button class="btn btn-save" onclick="simpanNama()">Simpan</button>
      <button class="btn btn-close" onclick="tutupPopup()">Tutup</button>
    </div>
  </div>

<script>
  // Pindah Halaman
  function bukaHalaman(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // Popup Edit Nama
  function bukaPopup() {
    document.getElementById('popupEdit').style.display = 'flex';
    document.getElementById('inputNama').value = document.getElementById('namaProfil').innerText;
  }
  function tutupPopup() {
    document.getElementById('popupEdit').style.display = 'none';
  }
  function simpanNama() {
    let namaBaru = document.getElementById('inputNama').value;
    document.getElementById('namaProfil').innerText = namaBaru;
    document.getElementById('namaBeranda').innerText = namaBaru; // update juga di beranda
    tutupPopup();
  }

  // Ganti Foto Profil
  function gantiFoto(event) {
    let file = event.target.files[0];
    let reader = new FileReader();
    reader.onload = function(e){
      document.getElementById('avatarProfil').style.backgroundImage = `url(${e.target.result})`;
      document.getElementById('avatarBeranda').style.backgroundImage = `url(${e.target.result})`;
    }
    reader.readAsDataURL(file);
  }

  // Ganti Banner
  function gantiBanner(event) {
    let file = event.target.files[0];
    let reader = new FileReader();
    reader.onload = function(e){
      document.querySelector('.banner').style.backgroundImage = `url(${e.target.result})`;
      document.querySelector('.banner').style.backgroundSize = 'cover';
    }
    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
