<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login XVvanNX</title>
<style>
    * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F0F0F0; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; gap: 15px; text-align: center; }
    h1 { font-size: 32px; }
    h1.v { border: 3px solid black; border-radius: 50%; padding: 0 6px; }
    input { width: 80%; max-width: 300px; padding: 12px; border: 3px solid black; border-radius: 10px; font-size: 16px; }
    button { padding: 12px 25px; background: #00B000; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
    <h1>X<span class="v">V</span>vanNX</h1>
    <p>Selamat Datang! Masukkan Nama Kamu</p>
    <input type="text" id="inputLoginNama" placeholder="Contoh: XVvanNX">
    <button onclick="loginSederhana()">Masuk</button>

<script>
    if(localStorage.getItem('xv_nama')){
        window.location.href = "index.html"; // kalau udah login langsung ke beranda
    }

    function loginSederhana(){
        let nama = document.getElementById('inputLoginNama').value;
        if(nama.trim()!== ""){
            localStorage.setItem('xv_nama', nama);
            window.location.href = "index.html"; // pindah ke beranda
        } else {
            alert("Nama jangan kosong ya!");
        }
    }
</script>
</body>
</html>
