<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari Teman</title>
<style>
body{background:#F0F0F0;padding:10px;font-family:Arial}
.header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{font-size:20px;font-weight:bold;cursor:pointer}
.search{width:100%;padding:10px;border:3px solid black;border-radius:12px;font-size:16px}
.user-list{margin-top:15px}
.user{display:flex;align-items:center;justify-content:space-between;background:white;padding:10px;border:3px solid black;border-radius:12px;margin-bottom:10px}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar{width:50px;height:50px;border-radius:50%;border:2px solid black;background:#ddd;background-size:cover}
.btn-tambah{background:#1D9BF0;color:white;border:none;padding:8px 15px;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <div class="back" onclick="window.location.href='index.html'">← Kembali</div>
</div>

<input type="text" class="search" id="searchInput" placeholder="🔍 Cari nama...">

<div class="user-list" id="userList">Memuat...</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC...",
  authDomain: "xvannx.firebaseapp.com",
  databaseURL: "https://xvannx-default-rtdb.firebaseio.com",
  projectId: "xvannx",
  storageBucket: "xvannx.appspot.com",
  messagingSenderId: "123",
  appId: "1:123:web:abc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = localStorage.getItem('xv_nama');

// Load semua user kecuali diri sendiri
db.ref('users').once('value').then(snapshot=>{
  let users = snapshot.val();
  let html = '';
  for(let key in users){
    if(users[key].nama!== currentUser){
      html += `
      <div class="user">
        <div class="user-info">
          <div class="user-avatar" style="background-image:url(${users[key].foto})"></div>
          <span>${users[key].nama}</span>
        </div>
        <button class="btn-tambah" onclick="tambahTeman('${key}','${users[key].nama}','${users[key].foto}')">Tambah</button>
      </div>`;
    }
  }
  document.getElementById('userList').innerHTML = html || "Ga ada user lain";
})

// Fungsi tambah teman
function tambahTeman(id,nama,foto){
  db.ref('teman/'+currentUser+'/'+id).set({nama:nama,foto:foto});
  alert(nama + " ditambahkan ke teman!");
}
</script>
</body>
</html>
