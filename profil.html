<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya</title>
<style>
body{background:#F0F0F0;margin:0;font-family:Arial}
.header{padding:10px;background:white;border-bottom:3px solid black;font-weight:bold}
.header span{cursor:pointer}
.banner{width:100%;height:150px;background:#ccc;background-size:cover;background-position:center;border-bottom:3px solid black;position:relative}
.btn-cam-banner{position:absolute;bottom:10px;right:10px;background:white;border:2px solid black;border-radius:50%;width:40px;height:40px;font-size:20px;line-height:40px;text-align:center;cursor:pointer}
.profil-info{background:white;padding:60px 15px 15px 15px;position:relative;border-bottom:3px solid black}
.avatar{width:100px;height:100px;border:4px solid white;border-radius:50%;background:#ddd;background-size:cover;background-position:center;position:absolute;top:-50px;left:15px;box-shadow:0 0 0 3px black}
.btn-cam-avatar{position:absolute;bottom:0;right:0;background:white;border:2px solid black;border-radius:50%;width:30px;height:30px;font-size:16px;line-height:30px;text-align:center;cursor:pointer}
.nama{font-size:22px;font-weight:bold;display:flex;align-items:center;gap:5px}
.stats{display:flex;gap:10px;margin-top:10px}
.stat{border:2px solid black;border-radius:8px;padding:5px 10px;font-size:14px;font-weight:bold}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="header"><span onclick="window.location.href='index.html'">← Kembali</span></div>

<div class="banner" id="bannerSaya">
  <label class="btn-cam-banner" for="inputBanner">📷</label>
  <input type="file" id="inputBanner" accept="image/*">
</div>

<div class="profil-info">
  <div class="avatar" id="avatarSaya">
    <label class="btn-cam-avatar" for="inputFoto">📷</label>
    <input type="file" id="inputFoto" accept="image/*">
  </div>
  <div class="nama">Ⓥ <span id="namaSaya"></span> ✏️</div>
  <div class="stats">
    <div class="stat"><span id="jmlTeman">0</span> Friend</div>
    <div class="stat">0 Followers</div>
    <div class="stat">0 Following</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = { apiKey: "AIzaSyCrTTBk1gPDVG4eVL_XfrdfFqelGPExSqU", authDomain: "van-social.firebaseapp.com", databaseURL: "https://van-social-default-rtdb.firebaseio.com", projectId: "van-social", storageBucket: "van-social.firebasestorage.app", messagingSenderId: "975410134186", appId: "1:975410134186:web:befaac94622eed85de64d3", measurementId: "G-ZVZXSKC42Q" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = localStorage.getItem('xv_nama');
let fotoBaru = "";
let bannerBaru = "";

db.ref('users/'+currentUser).once('value').then(s=>{
  let data = s.val();
  fotoBaru = data.foto || "";
  bannerBaru = data.banner || "";
  document.getElementById('namaSaya').innerText = currentUser;
  document.getElementById('avatarSaya').style.backgroundImage = `url(${fotoBaru})`;
  document.getElementById('bannerSaya').style.backgroundImage = `url(${bannerBaru})`;
})

// Hitung jumlah teman
db.ref('teman/'+currentUser).once('value').then(s=>{
  document.getElementById('jmlTeman').innerText = s.numChildren();
})

document.getElementById('inputFoto').onchange = e => {
  let reader = new FileReader();
  reader.onload = ev => { 
    fotoBaru = ev.target.result; 
    document.getElementById('avatarSaya').style.backgroundImage = `url(${fotoBaru})`;
    db.ref('users/'+currentUser).update({foto: fotoBaru}); // langsung simpan
  }
  reader.readAsDataURL(e.target.files[0]);
}
document.getElementById('inputBanner').onchange = e => {
  let reader = new FileReader();
  reader.onload = ev => { 
    bannerBaru = ev.target.result; 
    document.getElementById('bannerSaya').style.backgroundImage = `url(${bannerBaru})`;
    db.ref('users/'+currentUser).update({banner: bannerBaru}); // langsung simpan
  }
  reader.readAsDataURL(e.target.files[0]);
}
</script>
</body>
</html>
