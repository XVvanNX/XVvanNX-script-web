<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya</title>
<style>
body{background:#F0F0F0;padding:0;margin:0;font-family:Arial}
.header{display:flex;align-items:center;gap:10px;padding:10px;background:white;font-weight:bold;font-size:18px;border-bottom:3px solid black}
.banner{width:100%;height:150px;background:#ccc;background-size:cover;background-position:center;border-bottom:3px solid black;position:relative}
.edit-banner{position:absolute;bottom:10px;right:10px;background:white;padding:5px 10px;border:2px solid black;border-radius:8px;cursor:pointer;font-size:12px}
.profil-box{display:flex;flex-direction:column;align-items:center;background:white;padding:20px;margin-top:-50px;border:3px solid black;border-radius:12px;position:relative;z-index:2;margin: -50px 10px 0 10px}
.avatar{width:120px;height:120px;border:4px solid white;border-radius:50%;background:#ddd;background-size:cover;background-position:center;margin-bottom:15px;box-shadow:0 0 0 3px black;position:relative}
.edit-foto{position:absolute;bottom:0;right:0;background:white;padding:5px;border:2px solid black;border-radius:50%;cursor:pointer;font-size:14px}
.nama{font-size:24px;font-weight:bold}
input[type=file]{display:none}
button{margin-top:15px;padding:10px 20px;background:#1D9BF0;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div onclick="window.location.href='index.html'">←</div><div>Profil Saya</div></div>
<div class="banner" id="bannerSaya"><label class="edit-banner" for="inputBanner">Edit Banner</label><input type="file" id="inputBanner" accept="image/*"></div>
<div class="profil-box">
  <div class="avatar" id="avatarSaya"><label class="edit-foto" for="inputFoto">✏️</label><input type="file" id="inputFoto" accept="image/*"></div>
  <div class="nama" id="namaSaya"></div>
  <button onclick="simpan()">Simpan Perubahan</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig = { apiKey: "AIzaSyCrTTBk1gPDVG4eVL_XfrdfFqelGPExSqU", authDomain: "van-social.firebaseapp.com", databaseURL: "https://van-social-default-rtdb.firebaseio.com", projectId: "van-social", storageBucket: "van-social.firebasestorage.app", messagingSenderId: "975410134186", appId: "1:975410134186:web:befaac94622eed85de64d3", measurementId: "G-ZVZXSKC42Q" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = localStorage.getItem('xv_nama');
let fotoBaru = "";
let bannerBaru = "";

db.ref('users/'+currentUser).once('value').then(s=>{
  let data = s.val();
  fotoBaru = data.foto || "";
  bannerBaru = data.banner || "";
  document.getElementById('namaSaya').innerText = currentUser;
  document.getElementById('avatarSaya').style.backgroundImage = `url(${fotoBaru})`;
  document.getElementById('bannerSaya').style.backgroundImage = `url(${bannerBaru})`;
})

document.getElementById('inputFoto').onchange = e => {
  let reader = new FileReader();
  reader.onload = ev => { fotoBaru = ev.target.result; document.getElementById('avatarSaya').style.backgroundImage = `url(${fotoBaru})`; }
  reader.readAsDataURL(e.target.files[0]);
}
document.getElementById('inputBanner').onchange = e => {
  let reader = new FileReader();
  reader.onload = ev => { bannerBaru = ev.target.result; document.getElementById('bannerSaya').style.backgroundImage = `url(${bannerBaru})`; }
  reader.readAsDataURL(e.target.files[0]);
}

function simpan(){
  db.ref('users/'+currentUser).update({ foto: fotoBaru, banner: bannerBaru })
 .then(()=> alert("Profil disimpan!"));
}
</script>
</body>
</html>
